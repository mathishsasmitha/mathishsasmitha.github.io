<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mathish Sasmitha | Information Systems Engineering Portfolio</title>
<meta name="description" content="Portfolio of Mathish Sasmitha, an Information Systems Engineering undergraduate at SLIIT, Sri Lanka. Web applications built with Java, SQL, HTML and CSS.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230B0B0F'/%3E%3Ctext x='32' y='42' font-family='Georgia,serif' font-size='28' font-weight='700' text-anchor='middle' fill='%23A855F7'%3EMS%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0B0F; --surface:#14121C; --border:#2C2640; --text:#FFFFFF; --muted:#B9B4C9;
  --accent:#A855F7; --accent-2:#C084FC; --accent-deep:#7C3AED;
  --head:"Manrope","Segoe UI",system-ui,sans-serif; --body:"DM Sans","Segoe UI",system-ui,sans-serif;
  --serif:Georgia,"Times New Roman",serif; --radius:10px; --pad:clamp(20px,5vw,48px);
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.7 var(--body);overflow-x:hidden;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-font-smoothing:antialiased}
a{color:inherit}
h1,h2,h3{font-family:var(--head);margin:0;line-height:1.08;letter-spacing:-.02em}
p{margin:0}
.wrap{max-width:1200px;margin:0 auto;padding:0 var(--pad);position:relative}
.it{font-family:var(--serif);font-style:italic;font-weight:400}
.ac{color:var(--accent-2)}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:3px;border-radius:4px}
.skip{position:absolute;left:-999px;top:8px;background:#fff;color:#000;padding:8px 14px;border-radius:6px;z-index:100;font-weight:700}
.skip:focus{left:8px}
.label{font:500 12px/1.4 var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

.nav{position:sticky;top:0;z-index:50;background:rgba(11,11,15,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;height:68px}
.mark{font:800 22px var(--head);letter-spacing:-.03em;text-decoration:none}
.mark span{color:var(--accent-2)}
.links{display:flex;gap:30px;align-items:center;list-style:none;margin:0;padding:0}
.links a{text-decoration:none;color:var(--muted);font-size:15px;transition:color .2s}
.links a:hover{color:var(--text)}
.links a.pill{color:#fff;border:1px solid var(--accent);padding:8px 16px;border-radius:999px}
.links a.pill:hover{background:var(--accent-deep);border-color:var(--accent-deep)}
.burger{display:none;background:none;border:1px solid var(--border);color:var(--text);width:44px;height:44px;border-radius:8px;cursor:pointer;font-size:0}
.burger i,.burger i::before,.burger i::after{display:block;width:18px;height:2px;background:var(--text);position:relative;margin:auto;transition:transform .2s,background .2s}
.burger i::before,.burger i::after{content:"";position:absolute;left:0}
.burger i::before{top:-6px}.burger i::after{top:6px}
.burger[aria-expanded="true"] i{background:transparent}
.burger[aria-expanded="true"] i::before{transform:translateY(6px) rotate(45deg)}
.burger[aria-expanded="true"] i::after{transform:translateY(-6px) rotate(-45deg)}

.btn{display:inline-flex;align-items:center;font:700 15px var(--head);text-decoration:none;padding:14px 24px;border-radius:999px;border:1px solid var(--border);transition:transform .2s,background .2s,border-color .2s;background:none;color:var(--text)}
.btn:hover{transform:translateY(-2px);border-color:var(--accent-2)}
.btn.fill{background:var(--accent-deep);border-color:var(--accent-deep);color:#fff}
.btn.fill:hover{background:var(--accent);border-color:var(--accent)}
.btns{display:flex;flex-wrap:wrap;gap:14px;margin-top:36px}

/* hero + parallax layers */
.hero{position:relative;padding:clamp(48px,9vw,110px) 0 0;overflow:hidden}
.bg{position:absolute;pointer-events:none;will-change:transform}
.bg-ms{left:-3vw;top:6%;font:800 clamp(14rem,38vw,34rem)/0.8 var(--head);letter-spacing:-.06em;color:transparent;-webkit-text-stroke:1px #2C2640;user-select:none}
.bg-ring{width:clamp(220px,34vw,460px);aspect-ratio:1;border:1px solid rgba(168,85,247,.45);border-radius:50%;left:-8vw;top:38%}
.bg-dot{width:clamp(90px,12vw,170px);aspect-ratio:1;border-radius:50%;background:rgba(124,58,237,.35);right:22%;top:62%}
.hero-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:48px;position:relative}
.hero-top{display:flex;flex-wrap:wrap;gap:8px 28px;margin-bottom:36px}
.hero h1{font-size:clamp(2.6rem,7.4vw,5.6rem);font-weight:800;letter-spacing:-.035em}
.hero .intro{max-width:34em;margin-top:32px;color:var(--muted);font-size:1.125rem}
.hero .intro strong{color:var(--text);font-weight:500}

.divider{display:flex;align-items:center;gap:18px;margin:clamp(56px,8vw,96px) 0 0;position:relative}
.divider::after{content:"";flex:1;height:1px;background:var(--border)}

section.sec{padding:clamp(72px,10vw,130px) 0 0}
.sec-head{margin-bottom:48px;max-width:46em}
.sec-head h2{font-size:clamp(2rem,4.8vw,3.5rem);font-weight:800;margin-top:16px}
.sec-head p.sub{margin-top:18px;color:var(--muted);font-size:1.0625rem}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:transform .25s,border-color .25s}
.card:hover{transform:translateY(-3px);border-color:var(--accent)}
.panel{position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;padding:28px;min-height:230px;background:#120F1E;border-bottom:1px solid var(--border)}
.panel.hi{background:#1A1230}
.panel .ring{position:absolute;right:-60px;bottom:-80px;width:240px;aspect-ratio:1;border:1px solid rgba(168,85,247,.5);border-radius:50%;will-change:transform}
.panel .ptag{font:500 12px var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);position:relative}
.panel .pname{font:800 clamp(1.5rem,3vw,2.3rem)/1.05 var(--head);letter-spacing:-.03em;position:relative;will-change:transform}
.panel img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pbody{padding:28px}
.pbody h3{font-size:1.4rem;font-weight:700;letter-spacing:-.015em}
.period{margin-top:10px;color:var(--accent-2);font-size:14px;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 0;padding:0;list-style:none}
.chips li{border:1px solid var(--border);border-radius:6px;padding:3px 11px;font-size:13.5px}
.sum{margin-top:16px;color:var(--muted)}
.more{margin-top:20px;background:none;border:0;color:var(--accent-2);font:700 14px var(--head);cursor:pointer;padding:6px 0;display:inline-flex;gap:8px;align-items:center}
.more .pl{display:inline-block;width:14px;transition:transform .25s;text-align:center}
.more[aria-expanded="true"] .pl{transform:rotate(45deg)}
.detail{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
.detail.open{grid-template-rows:1fr}
.detail>div{overflow:hidden}
.detail p{color:var(--muted);padding-top:12px}
.feature{display:grid;grid-template-columns:minmax(0,1fr)}
.feature .panel{min-height:260px}
@media(min-width:900px){
  .feature{grid-template-columns:minmax(0,5fr) minmax(0,6fr)}
  .feature .panel{min-height:100%;border-bottom:0;border-right:1px solid var(--border)}
  .feature .pbody{padding:40px}
}
.grid2{display:grid;grid-template-columns:minmax(0,1fr);gap:24px;margin-top:24px}
@media(min-width:900px){
  .grid2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2 .wide{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr)}
  .grid2 .wide .panel{border-bottom:0;border-right:1px solid var(--border)}
}

.about{display:grid;grid-template-columns:minmax(0,1fr);gap:48px}
@media(min-width:900px){.about{grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:72px}}
.about .copy p{color:var(--muted);font-size:1.0625rem;max-width:36em}
.about .copy p+p{margin-top:1.2em}
.edu{border:1px solid var(--border);background:var(--surface);border-radius:var(--radius);padding:28px;align-self:start}
.edu h3{font-size:1.15rem}
.edu dl{margin:18px 0 0;display:grid;gap:16px}
.edu dt{font:500 12px var(--head);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.edu dd{margin:2px 0 0;font:700 1.05rem var(--head)}

.skills{display:grid;grid-template-columns:minmax(0,1fr);gap:24px}
@media(min-width:900px){.skills{grid-template-columns:repeat(3,minmax(0,1fr))}}
.skills .card:hover{transform:none}
.skills h3{font-size:1.15rem}
.skills ul{list-style:none;margin:18px 0 0;padding:0}
.skills li{padding:10px 0;border-top:1px solid var(--border)}
.note{margin-top:28px;color:var(--muted);font-size:14.5px;max-width:44em}

.contact h2{font-size:clamp(2.2rem,6vw,4.6rem);font-weight:800;margin-top:16px;letter-spacing:-.035em}
.contact .lead{margin-top:26px;color:var(--muted);font-size:1.125rem;max-width:30em}
.contact .btns{margin-top:32px}

footer{margin-top:clamp(72px,10vw,130px);border-top:1px solid var(--border);padding:32px 0}
footer .wrap{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;color:var(--muted);font-size:14.5px}
footer .mark{font-size:18px;color:var(--text)}
.fcontact{display:flex;flex-wrap:wrap;gap:6px 28px}
.fcontact a{color:var(--text);text-decoration:none;border-bottom:1px solid transparent;transition:border-color .2s,color .2s}
.fcontact a:hover{color:var(--accent-2);border-color:var(--accent-2)}

@media(max-width:820px){
  .burger{display:block}
  .links{position:absolute;left:0;right:0;top:68px;flex-direction:column;align-items:stretch;gap:0;background:var(--bg);border-bottom:1px solid var(--border);padding:8px var(--pad) 20px;display:none}
  .links.open{display:flex}
  .links li{border-top:1px solid var(--border)}
  .links li:first-child{border-top:0}
  .links a{display:block;padding:16px 0;font-size:17px}
  .links a.pill{border:0;border-radius:0;padding:16px 0;color:var(--accent-2)}
  .links a.pill:hover{background:none}
}


/* hero: photo scene, details, load-in */
.hero{min-height:min(880px,100svh);--rx:0deg;--ry:0deg;--tx:0px;--sy:0px}
.hero::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(90deg,var(--bg) 0%,var(--bg) 28%,rgba(11,11,15,.6) 52%,rgba(11,11,15,0) 78%)}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:200px;z-index:1;pointer-events:none;background:linear-gradient(rgba(11,11,15,0),var(--bg))}
.hero .wrap{z-index:2}
.stage{position:absolute;top:0;right:0;bottom:0;width:min(66%,880px);perspective:1100px;z-index:0;pointer-events:none}
.scene{position:absolute;inset:0;transform-style:preserve-3d;transform:translate3d(var(--tx),var(--sy),0) rotateX(var(--rx)) rotateY(var(--ry));transition:transform .25s ease-out;will-change:transform}
.glow{position:absolute;inset:6% 0 0 10%;background:radial-gradient(circle at 60% 42%,rgba(124,58,237,.42),rgba(124,58,237,0) 62%);transform:translateZ(-90px)}
.frame{position:absolute;top:10%;bottom:0;left:20%;right:8%;border:1px solid rgba(168,85,247,.5);border-bottom:0;transform:translateZ(-50px)}
.photo{position:absolute;right:0;bottom:0;height:96%;width:auto;max-width:100%;object-fit:cover;filter:contrast(1.06);-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 34%,#000 88%,transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 34%,#000 88%,transparent 100%);transform:translateZ(0)}
.chip{position:absolute;right:10%;bottom:16%;transform:translateZ(80px);background:rgba(11,11,15,.82);border:1px solid var(--accent);border-radius:999px;padding:8px 16px;font:700 13px var(--head);color:#fff;animation:float 6s ease-in-out infinite}
.hero-copy{max-width:640px}
.name{font:700 1.15rem var(--head);display:flex;align-items:center;gap:12px;margin:0 0 20px}
.name::before{content:"";width:34px;height:2px;background:var(--accent)}
.ln{display:block;overflow:hidden;padding-bottom:.1em;margin-bottom:-.1em}
.ln>span{display:block;animation:lineUp .95s cubic-bezier(.2,.7,.2,1) both}
.rise{animation:rise .85s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--d,0s)}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;margin:40px 0 0;background:var(--border);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.facts div{background:#100E18;padding:14px 18px}
.facts dt{font:500 11px var(--head);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.facts dd{margin:3px 0 0;font:700 .98rem/1.35 var(--head)}
.social{display:flex;flex-wrap:wrap;gap:10px 24px;list-style:none;margin:22px 0 0;padding:0}
.social a{text-decoration:none;font:700 14px var(--head);color:var(--accent-2);border-bottom:1px solid transparent;transition:border-color .2s}
.social a:hover{border-color:var(--accent-2)}
.bg-dot{animation:float 7s ease-in-out infinite}
.bg-ring{animation:float 9s ease-in-out infinite reverse}
@keyframes lineUp{from{transform:translateY(110%)}}
@keyframes rise{from{opacity:0;transform:translateY(26px)}}
@keyframes float{50%{translate:0 -14px}}
@keyframes slide{to{transform:translateX(-50%)}}
@media(max-width:959px){
  .stage{width:100%;opacity:.38}
  .hero::before{background:linear-gradient(90deg,rgba(11,11,15,.78),rgba(11,11,15,.45))}
  .chip{display:none}
}
@media(max-width:520px){.facts{grid-template-columns:minmax(0,1fr)}}

/* marquee */
.marquee{overflow:hidden;border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin-top:28px;padding:16px 0;position:relative;z-index:2;background:var(--bg)}
.track{display:flex;width:max-content;animation:slide 45s linear infinite}
.marquee:hover .track{animation-play-state:paused}
.track ul{display:flex;list-style:none;margin:0;padding:0}
.track li{font:800 clamp(1.1rem,2.4vw,1.6rem) var(--head);letter-spacing:-.02em;color:var(--muted);padding-right:28px;white-space:nowrap}
.track li::after{content:"◆";color:var(--accent);font-size:.5em;margin-left:28px;vertical-align:middle}

/* progress, portrait, timeline */
.progress{position:fixed;top:0;left:0;right:0;height:3px;background:var(--accent);transform-origin:0 0;transform:scaleX(0);z-index:60}
.aside{display:grid;gap:24px;align-self:start}
.portrait{margin:0;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:var(--surface);transition:transform .18s ease-out,border-color .25s;will-change:transform}
.portrait:hover{border-color:var(--accent)}
.portrait img{display:block;width:100%;height:auto;max-height:480px;object-fit:cover;object-position:50% 25%}
.edu ol{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:18px}
.edu li{border-left:2px solid var(--accent);padding-left:14px;display:grid;gap:2px}
.edu .per{font:500 12px var(--head);letter-spacing:.1em;color:var(--accent-2)}
.edu li strong{font:700 1rem/1.35 var(--head)}
.edu .pl2{color:var(--muted);font-size:14.5px}
.anim .skills li{opacity:0}
.anim .skills.in li{opacity:1}
.anim .reveal.in[data-tilt]{transition:transform .18s ease-out,border-color .25s}
/* about balance */
.left{display:grid;gap:36px;align-self:start}
.focus2{border-left:2px solid var(--accent);padding:4px 0 4px 22px}
.focus2 .q{font:800 clamp(1.4rem,2.6vw,2rem)/1.2 var(--head);letter-spacing:-.02em;margin-top:10px}
.focus2 .t{margin-top:14px;font:500 12px var(--head);letter-spacing:.14em;color:var(--accent-2)}

/* skills effects */
#skills{position:relative;overflow:hidden}
.bg-ring2{width:clamp(260px,36vw,460px);aspect-ratio:1;border:1px solid rgba(168,85,247,.32);border-radius:50%;right:-9vw;top:14%;animation:spin 28s linear infinite}
.bg-ring2::after{content:"";position:absolute;width:14px;height:14px;border-radius:50%;background:var(--accent);top:-7px;left:50%;margin-left:-7px}
@keyframes spin{to{rotate:360deg}}
@keyframes pop{from{opacity:0;translate:0 14px;scale:.88}to{opacity:1;translate:0 0;scale:1}}
.skills .card{position:relative}
.skills .card::before{content:"";position:absolute;inset:0;background:radial-gradient(340px circle at var(--mx,50%) var(--my,0%),rgba(168,85,247,.24),rgba(168,85,247,0) 62%);opacity:0;transition:opacity .3s;pointer-events:none}
.skills .card::after{content:"";position:absolute;left:0;top:0;height:2px;width:100%;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform .5s ease}
.skills .card:hover::before{opacity:1}
.skills .card:hover::after{transform:scaleX(1)}
.skills .pbody{position:relative}
.skills .count{margin:6px 0 0;color:var(--muted);font-size:13.5px}
.skills ul{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0 0}
.skills li{padding:8px 16px;border:1px solid var(--border);border-radius:999px;font-size:15px;background:rgba(255,255,255,.02);transition:background .2s,border-color .2s,transform .2s}
.skills li:hover{background:var(--accent-deep);border-color:var(--accent);transform:translateY(-3px) scale(1.04)}
.anim .skills.in li{animation:pop .55s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i)*80ms + .3s)}
.anim .reveal{opacity:0;transform:translateY(14px);transition:opacity .7s ease,transform .7s ease}
.anim .reveal.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{transition:none!important;animation:none!important}
  .anim .reveal,.anim .skills li{opacity:1;transform:none}
  .track{animation:none;flex-wrap:wrap;width:auto}
}
</style>
</head>

/* ============================================================
   React components (createElement, no build step needed)
   ============================================================ */
const { createElement: h, useState, useEffect, useRef, Fragment } = React;
const isUrl = (v) => /^https?:\/\/\S+$/i.test(v || "");
const isEmail = (v) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v || "");
const isPath = (v) => typeof v === "string" && v.trim().length > 0;
const ext = (href, children, cls) => h("a", { className: cls, href, target: "_blank", rel: "noopener noreferrer" }, children);

/* Parallax: any element with data-speed moves relative to its parent's
   distance from the viewport centre. Positive = drifts slower than scroll. */
function useParallax() {
  useEffect(() => {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const els = Array.from(document.querySelectorAll("[data-speed]"));
    let ticking = false;
    const update = () => {
      ticking = false;
      const vh = window.innerHeight;
      els.forEach((el) => {
        const r = el.parentElement.getBoundingClientRect();
        if (r.bottom < -200 || r.top > vh + 200) return;
        const offset = r.top + r.height / 2 - vh / 2;
        el.style.transform = "translate3d(0," + (offset * parseFloat(el.dataset.speed)).toFixed(1) + "px,0)";
      });
    };
    const onScroll = () => { if (!ticking) { ticking = true; requestAnimationFrame(update); } };
    update();
    window.addEventListener("scroll", onScroll, { passive: true });
    window.addEventListener("resize", onScroll);
    return () => { window.removeEventListener("scroll", onScroll); window.removeEventListener("resize", onScroll); };
  }, []);
}

function useReveal() {
  useEffect(() => {
    try {
      if (!("IntersectionObserver" in window) || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      const io = new IntersectionObserver((entries) => entries.forEach((en) => {
        if (en.isIntersecting) { en.target.classList.add("in"); io.unobserve(en.target); }
      }), { threshold: 0.12 });
      document.documentElement.classList.add("anim");
      document.querySelectorAll(".reveal").forEach((el) => io.observe(el));
      return () => io.disconnect();
    } catch (e) { document.documentElement.classList.remove("anim"); }
  }, []);
}

function useTilt() {
  useEffect(() => {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches || !matchMedia("(hover: hover)").matches) return;
    const offs = [];
    document.querySelectorAll("[data-tilt]").forEach((el) => {
      const move = (e) => {
        const r = el.getBoundingClientRect();
        const x = (e.clientX - r.left) / r.width - 0.5, y = (e.clientY - r.top) / r.height - 0.5;
        if (el.dataset.spot) { el.style.setProperty("--mx", (e.clientX - r.left) + "px"); el.style.setProperty("--my", (e.clientY - r.top) + "px"); }
        el.style.transform = "perspective(900px) rotateX(" + (-y * 6).toFixed(2) + "deg) rotateY(" + (x * 8).toFixed(2) + "deg) translateY(-3px)";
      };
      const leave = () => { el.style.transform = ""; };
      el.addEventListener("pointermove", move); el.addEventListener("pointerleave", leave);
      offs.push(() => { el.removeEventListener("pointermove", move); el.removeEventListener("pointerleave", leave); });
    });
    return () => offs.forEach((f) => f());
  }, []);
}

function useProgress() {
  useEffect(() => {
    const bar = document.getElementById("progress");
    const f = () => { const m = document.documentElement.scrollHeight - window.innerHeight; bar.style.transform = "scaleX(" + (m > 0 ? window.scrollY / m : 0) + ")"; };
    f(); window.addEventListener("scroll", f, { passive: true }); window.addEventListener("resize", f);
    return () => { window.removeEventListener("scroll", f); window.removeEventListener("resize", f); };
  }, []);
}

function Navbar() {
  const [open, setOpen] = useState(false);
  const burger = useRef(null);
  useEffect(() => {
    const onKey = (e) => { if (e.key === "Escape" && open) { setOpen(false); burger.current && burger.current.focus(); } };
    document.addEventListener("keydown", onKey);
    return () => document.removeEventListener("keydown", onKey);
  }, [open]);

function Hero() {

    const set = (k, v) => el.style.setProperty(k, v);
    const onMove = (e) => {
      const r = el.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width - 0.5, y = (e.clientY - r.top) / r.height - 0.5;
      set("--ry", (x * 14).toFixed(2) + "deg"); set("--rx", (-y * 10).toFixed(2) + "deg"); set("--tx", (-x * 18).toFixed(1) + "px");
    };
    const onLeave = () => { set("--ry", "0deg"); set("--rx", "0deg"); set("--tx", "0px"); };
    const onScroll = () => {
      const y = window.scrollY;
      set("--sy", Math.min(y, 900) * 0.14 + "px");
      if (!fine) set("--ry", (Math.sin(y / 240) * 7).toFixed(2) + "deg");
    };
    if (fine) { el.addEventListener("pointermove", onMove); el.addEventListener("pointerleave", onLeave); }
    window.addEventListener("scroll", onScroll, { passive: true });
    onScroll();
    return () => { el.removeEventListener("pointermove", onMove); el.removeEventListener("pointerleave", onLeave); window.removeEventListener("scroll", onScroll); };
  }, []);
  const P = SITE.profile;
  const facts = [["Based in", P.location], ["University", P.university], ["Degree", P.degree], ["Studying", P.years]];
  if (P.phone) facts.push(["Phone", P.phone]);

      h("div", { className: "frame", "aria-hidden": "true" }),
      h("img", { className: "photo", src: SITE.photos.hero, alt: "Black and white portrait of Mathish Sasmitha seated in a dark suit", width: 730, height: 768 }),
      h("div", { className: "chip", "aria-hidden": "true" }, "SLIIT · Information Systems Engineering"))),
    h("div", { className: "bg bg-ms", "data-speed": "0.18", "aria-hidden": "true" }, "MS"),

    h("div", { className: "bg bg-dot", "data-speed": "-0.12", "aria-hidden": "true" }),
    h("div", { className: "wrap" },
      h("div", { className: "hero-copy" },
        h("div", { className: "hero-top label rise" }, h("span", null, "Developer · Information Systems"), h("span", null, "Based in Sri Lanka")),
        h("p", { className: "name rise", style: d(".1s") }, SITE.name),
        h("h1", { id: "hero-title" },
          h("span", { className: "ln" }, h("span", { style: { animationDelay: ".15s" } }, "Turning ideas into")),
          h("span", { className: "ln" }, h("span", { style: { animationDelay: ".3s" } }, h("span", { className: "it" }, "working"), " ", h("span", { className: "ac" }, "software.")))),
        h("p", { className: "intro rise", style: d(".55s") }, "An Information Systems Engineering undergraduate who enjoys connecting business needs with thoughtful web applications."),
        h("div", { className: "btns rise", style: d(".7s") },
          h("a", { className: "btn fill", href: "#work" }, "Explore my work"),

          isPath(SITE.links.cv) ? h("a", { className: "btn", href: SITE.links.cv, download: SITE.links.cvName || "CV.pdf" }, "Download CV") : null),
        h("dl", { className: "facts rise", style: d(".85s") }, facts.map(([k, v]) => h("div", { key: k }, h("dt", null, k), h("dd", null, v)))),
